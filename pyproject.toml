[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl94-ai"
version = "0.1.0"
description = "NHL94 agents, training, evaluation, and gameplay"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "stable-retro>=1.0.1", "stable-baselines3>=2.9.0", "gymnasium>=1.1.1",
  "numpy>=2.2.6", "torch>=2.8.0", "opencv-python>=4.11.0.86",
  "tensorboard>=2.19.0", "torchsummary>=1.5.1",
]

[project.optional-dependencies]
display = ["pygame-ce>=2.5.8", "matplotlib>=3.10.3"]
vision = ["timm>=1.0.15"]
export = ["onnx>=1.18.0", "onnxruntime>=1.22.0"]
dev = ["pylint>=3.3.7", "build>=1.2"]

[project.scripts]
nhl94 = "nhl94_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nhl94_ai*"]
exclude = ["tests*", "models*", "configs*"]

[tool.setuptools.package-data]
nhl94_ai = ["data/*.json", "data/training/*.json"]

[tool.pylint.messages_control]
disable = [
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "global-statement",
  "unused-argument",
  "unused-variable",
  "broad-exception-raised",
  "invalid-name",
  "singleton-comparison",
  "missing-final-newline",
  "no-member",
  "redefined-builtin",
  "unknown-option-value",
  "multiple-statements",
  "consider-using-f-string",
  "superfluous-parens",
  "bad-indentation",
  "too-many-positional-arguments",
  "duplicate-code",
  "too-few-public-methods",
  "too-many-arguments",
  "multiple-imports",
  "too-many-return-statements",
  "attribute-defined-outside-init",
  "too-many-instance-attributes",
  "fixme",
  "consider-using-sys-exit",
  "too-many-locals",
  "arguments-renamed",
  "redefined-outer-name",
  "inconsistent-return-statements",
  "no-else-return",
  "super-with-arguments",
  "too-many-statements",
  "useless-object-inheritance",
  "consider-using-in",
  "use-dict-literal",
  "possibly-used-before-assignment",
  "consider-using-max-builtin",
  "consider-swap-variables",
  "import-error",
  "wrong-import-order",
  "wrong-import-position",
  "ungrouped-imports",
  "import-outside-toplevel",
  "unused-import",
  "reimported",
  "consider-using-from-import",
  "too-many-lines",
  "too-many-branches",
  "too-many-nested-blocks",
  "useless-return",
  "chained-comparison",
  "no-else-raise",
  "unreachable",
  "protected-access",
  "broad-exception-caught",
  "keyword-arg-before-vararg"
]
