name: Python checks
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pylint nhl94_ai tests
      - run: python -m build --wheel
      - name: Test the wheel outside the checkout
        run: |
          python -m venv --system-site-packages /tmp/nhl94-wheel
          /tmp/nhl94-wheel/bin/pip install --no-deps --ignore-installed dist/*.whl
          cd /tmp
          /tmp/nhl94-wheel/bin/python -c "import nhl94_ai; assert '/tmp/nhl94-wheel/' in nhl94_ai.__file__"
          /tmp/nhl94-wheel/bin/nhl94 --help
          /tmp/nhl94-wheel/bin/nhl94 train --help
          /tmp/nhl94-wheel/bin/nhl94 export --help
