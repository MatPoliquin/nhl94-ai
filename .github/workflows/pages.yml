name: Browser arena

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'configs/classic_bot.json'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'configs/classic_bot.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-arena-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test browser arena
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '3.1.74'
          actions-cache-folder: '.emsdk-cache'
      # Set Node after the SDK so npm uses the app's supported runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:core
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the production site
        run: npx playwright test --project=chromium
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Deploy browser arena
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
